[workspace]
members = ["crates/hiewbie-core", "crates/hiewbie", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/stokaro/hiewbie"

[workspace.dependencies]
hiewbie-core = { path = "crates/hiewbie-core" }
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
tempfile = "=3.23.0"
same-file = "=1.0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
