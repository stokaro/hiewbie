[workspace]
members = ["crates/hiewbie-core", "crates/hiewbie", "xtask", "fuzz/replay"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/stokaro/hiewbie"

[workspace.dependencies]
hiewbie-core = { path = "crates/hiewbie-core" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
tempfile = "=3.23.0"
same-file = "=1.0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
iced-x86 = { version = "=1.22.0", default-features = false, features = ["std", "decoder", "encoder", "op_code_info", "intel", "instr_info"] }
yaxpeax-arm = { version = "=0.5.0", default-features = false, features = ["std", "fmt", "non-exhaustive-enums"] }
yaxpeax-arch = { version = "=0.3.3", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
