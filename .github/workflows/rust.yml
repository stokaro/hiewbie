name: Rust

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  matrix:
    name: Read required target strategies
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.manifest.outputs.native }}
      check: ${{ steps.manifest.outputs.check }}
      toolchain: ${{ steps.manifest.outputs.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive matrices from the manifest
        id: manifest
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import tomllib

          manifest = json.loads(Path("build/targets.json").read_text())
          assert manifest["schema_version"] == 2
          toolchain = tomllib.loads(Path(manifest["toolchain_source"]).read_text())
          outputs = {"toolchain": toolchain["toolchain"]["channel"]}
          for mode in ("native", "check"):
              entries = [
                  {
                      "target": target["triple"],
                      "runner": target["ci"]["runner"],
                      "host": target["ci"]["host"],
                      "package": target["build"]["package"],
                      "pty": target["ci"].get("pty", False),
                      "build_env": target["build"]["environment"],
                  }
                  for target in manifest["targets"]
                  if target["ci"]["mode"] == mode
              ]
              assert entries, f"No {mode} strategies in target manifest"
              outputs[mode] = json.dumps({"include": entries}, separators=(",", ":"))
          for target in manifest["targets"]:
              if target["ci"]["mode"] == "blocked":
                  print(f"Required target remains blocked: {target['triple']}: {target['ci']['reason']}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in outputs.items():
                  output.write(f"{key}={value}\n")
          PY

  native:
    name: Native · ${{ matrix.target }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.native) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.matrix.outputs.toolchain }}-${{ matrix.host }}
      EXPECTED_HOST: ${{ matrix.host }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.build_env.MACOSX_DEPLOYMENT_TARGET || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned native Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Verify native compiler architecture
        run: |
          rustc --version --verbose
          actual_host="$(rustc --version --verbose | tr -d '\r' | sed -n 's/^host: //p')"
          if [ "$actual_host" != "$EXPECTED_HOST" ]; then
            echo "::error::Expected native Rust host $EXPECTED_HOST; found $actual_host"
            exit 1
          fi
      - name: Check formatting, Clippy, and workspace tests
        run: cargo xtask check
      - name: Run the text assembler evaluation
        run: |
          cargo fmt --manifest-path experiments/assembler/Cargo.toml -- --check
          cargo run --locked --manifest-path experiments/assembler/Cargo.toml --features compare-asm-rs
      - name: Build and exercise the native command
        run: |
          cargo build --package hiewbie --locked
          cargo run --quiet --package hiewbie --locked -- --help
          cargo run --quiet --package hiewbie --locked -- --version
          cargo run --quiet --package hiewbie --locked -- --capabilities
      - name: Inspect the exact native artifact and record compiled capabilities
        id: inspection
        run: |
          artifact=target/debug/hiewbie
          if [[ "$EXPECTED_HOST" == *-windows-* ]]; then
            artifact="$artifact.exe"
            if [ -d "/c/Program Files/LLVM/bin" ]; then
              export PATH="/c/Program Files/LLVM/bin:$PATH"
            fi
          fi
          mkdir -p target/evidence
          if ! cargo xtask inspect --target "$EXPECTED_HOST" --artifact "$artifact" \
            --commit "$(git rev-parse HEAD)" > target/evidence/inspection.json; then
            python3 -c 'import json; print("Inspection diagnostics:", json.load(open("target/evidence/inspection.json"))["diagnostics"])'
            exit 1
          fi
          "$artifact" --capabilities --json > target/evidence/compiled-capabilities.json
      - name: Retain artifact inspection metadata
        if: ${{ always() && (steps.inspection.outcome == 'success' || steps.inspection.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-inspection-${{ matrix.target }}
          path: target/evidence/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Test Unix PTY supervision and failure detection
        if: ${{ matrix.pty }}
        run: python3 -m unittest discover -s scripts -p 'test_pty_smoke.py' -v
      - name: Exercise Unix terminal editing and cleanup
        if: ${{ matrix.pty }}
        run: python3 scripts/pty_smoke.py --binary target/debug/hiewbie

  compile:
    name: Compile only · ${{ matrix.target }} · ${{ matrix.package }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.check) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.matrix.outputs.toolchain }}-${{ matrix.host }}
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and the target standard library
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUSTUP_TOOLCHAIN" "$BUILD_TARGET"
      - name: Check target compilation without linking or runtime claims
        run: cargo check --locked --package "$BUILD_PACKAGE" --target "$BUILD_TARGET"
      - name: Check both portable assembler candidates for the target
        run: cargo check --locked --manifest-path experiments/assembler/Cargo.toml --features compare-asm-rs --target "$BUILD_TARGET"
      - name: Link and run the standalone WebAssembly assembler probe
        if: ${{ matrix.target == 'wasm32-unknown-unknown' }}
        env:
          CARGO_TARGET_DIR: target/assembler-probe
        run: |
          cargo build --locked --manifest-path experiments/assembler/Cargo.toml --lib --release --features compare-asm-rs --target "$BUILD_TARGET"
          node experiments/assembler/check-wasm.mjs "target/assembler-probe/$BUILD_TARGET/release/hiewbie_assembler_probe.wasm"
