[package]
name = "hiewbie-libfuzzer"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
hiewbie-fuzz-replay = { path = "../replay" }

[[bin]]
name = "formats_symbols"
path = "fuzz_targets/formats_symbols.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decoder"
path = "fuzz_targets/decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "addresses"
path = "fuzz_targets/addresses.rs"
test = false
doc = false
bench = false

[[bin]]
name = "search"
path = "fuzz_targets/search.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edit_commands"
path = "fuzz_targets/edit_commands.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
overflow-checks = true
